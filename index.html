<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peachy — Customised Aesthetic Accessories & Makeup Rituals</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        peachy: {
                            bg: '#FDFBF7',
                            card: '#FFFDF9',
                            blush: '#F8E8E0',
                            sand: '#EBE3D5',
                            rose: '#E8A598',
                            terracotta: '#D88A78',
                            espresso: '#2C221E',
                            muted: '#7A6E67',
                            accent: '#F3D2C1'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) scale(1)' },
                            '50%': { transform: 'translateY(-15px) scale(1.03)' },
                        },
                        shimmer: {
                            '100%': { transform: 'translateX(100%)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        float: 'float 8s ease-in-out infinite',
                        'float-slow': 'float 12s ease-in-out infinite reverse',
                        fadeIn: 'fadeIn 0.4s ease-out forwards'
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #FDFBF7;
            color: #2C221E;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism effects */
        .glass-nav {
            background: rgba(253, 251, 247, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(235, 227, 213, 0.5);
        }

        .glass-card {
            background: rgba(255, 253, 249, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(248, 232, 224, 0.6);
        }

        .dreamy-gradient {
            background: radial-gradient(circle at 20% 20%, rgba(248, 232, 224, 0.85) 0%, rgba(253, 251, 247, 0) 50%),
                        radial-gradient(circle at 80% 70%, rgba(243, 210, 193, 0.7) 0%, rgba(253, 251, 247, 0) 60%),
                        radial-gradient(circle at 50% 30%, rgba(232, 165, 152, 0.3) 0%, rgba(253, 251, 247, 0) 70%);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7;
        }
        ::-webkit-scrollbar-thumb {
            background: #EBE3D5;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D88A78;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
